name: Build offline HeroList APK and Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'standalone/**'
      - 'app/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'vite.config.ts'
      - 'scripts/verify-offline-assets.mjs'
      - '.github/workflows/build-standalone.yml'

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static offline site
        run: npm run build
        env:
          HEROLIST_PAGES: "1"
          HEROLIST_OFFLINE: "1"
      - name: Verify all offline assets resolve from root
        run: node scripts/verify-offline-assets.mjs
      - name: Ensure app entry points exist
        run: |
          test -f dist/client/index.html
          test -f dist/client/account/index.html
          test -f dist/client/adventure/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: herolist-offline-static
          path: dist/client/
          retention-days: 7

  android:
    needs: site
    runs-on: ubuntu-latest
    env:
      HEROLIST_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HEROLIST_ANDROID_KEYSTORE_PASSWORD }}
      HEROLIST_ANDROID_KEY_ALIAS: ${{ secrets.HEROLIST_ANDROID_KEY_ALIAS }}
      HEROLIST_ANDROID_KEY_PASSWORD: ${{ secrets.HEROLIST_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Android launch assets
        run: |
          python -m pip install Pillow
          python standalone/scripts/generate_branding.py --source public/favicon.ico --out .
      - uses: actions/download-artifact@v4
        with:
          name: herolist-offline-static
          path: standalone/android/app/src/main/assets/site
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          fi
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore persistent Android signing key
        env:
          HEROLIST_ANDROID_KEYSTORE_BASE64: ${{ secrets.HEROLIST_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for variable in HEROLIST_ANDROID_KEYSTORE_BASE64 HEROLIST_ANDROID_KEYSTORE_PASSWORD HEROLIST_ANDROID_KEY_ALIAS HEROLIST_ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Missing repository Actions secret $variable. Refusing to publish an APK signed by an ephemeral debug key."
              exit 1
            fi
          done
          signing_file="$RUNNER_TEMP/herolist-release.jks"
          printf '%s' "$HEROLIST_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          chmod 600 "$signing_file"
          echo "HEROLIST_ANDROID_KEYSTORE_FILE=$signing_file" >> "$GITHUB_ENV"
      - name: Build stable-signed Android release APK
        working-directory: standalone/android
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify Android package signature
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs standalone/android/app/build/outputs/apk/release/app-release.apk
      - name: Copy Android release candidate
        run: |
          mkdir -p release/android
          cp standalone/android/app/build/outputs/apk/release/app-release.apk release/android/HeroList-Android-Offline.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HeroList-Android-Offline-APK
          path: release/android/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    needs: site
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: herolist-offline-static
          path: standalone/windows/site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Windows launch assets
        run: |
          python -m pip install Pillow
          python standalone/scripts/generate_branding.py --source public/favicon.ico --out .
      - name: Install desktop packaging tool
        working-directory: standalone/windows
        run: npm install --no-audit --no-fund
      - name: Build portable Windows EXE
        working-directory: standalone/windows
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: HeroList-Windows-Standalone-EXE
          path: release/windows/*.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HeroList-Android-Offline-APK
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: HeroList-Windows-Standalone-EXE
          path: release/windows
      - name: Publish standalone APK and EXE as direct release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view standalone-latest >/dev/null 2>&1 || gh release create standalone-latest --title "HeroList Offline (Android and Windows)" --notes "Standalone offline builds from GitHub Actions. APK uses a persistent release key supplied through GitHub Actions secrets; Windows EXE is portable and unsigned. Both save characters locally." --prerelease --target "$GITHUB_SHA"
          gh release upload standalone-latest release/android/*.apk release/windows/*.exe --clobber
