name: Build offline HeroList APK and Windows EXE

# Standalone packages must not rebuild on site, mobile, or game-mode changes.
# Resume APK/EXE builds only after mobile behavior is confirmed on real devices
# and someone deliberately starts this workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release/requests/mobile-confirmed-2026-10-26.md'

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static offline site
        run: npm run build
        env:
          HEROLIST_PAGES: "1"
          HEROLIST_OFFLINE: "1"
      - name: Verify all offline assets resolve from root
        run: node scripts/verify-offline-assets.mjs
      - name: Ensure app entry points exist
        run: |
          test -f dist/client/index.html
          test -f dist/client/account/index.html
          test -f dist/client/adventure/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: herolist-offline-static
          path: dist/client/
          retention-days: 7

  android:
    needs: site
    runs-on: ubuntu-latest
    env:
      HEROLIST_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HEROLIST_ANDROID_KEYSTORE_PASSWORD }}
      HEROLIST_ANDROID_KEY_ALIAS: ${{ secrets.HEROLIST_ANDROID_KEY_ALIAS }}
      HEROLIST_ANDROID_KEY_PASSWORD: ${{ secrets.HEROLIST_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Android launch assets
        run: |
          python -m pip install Pillow
          python standalone/scripts/generate_branding.py --source public/favicon.ico --out .
      - uses: actions/download-artifact@v4
        with:
          name: herolist-offline-static
          path: standalone/android/app/src/main/assets/site
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          fi
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Select Android signing mode
        env:
          HEROLIST_ANDROID_KEYSTORE_BASE64: ${{ secrets.HEROLIST_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          signing_vars=(HEROLIST_ANDROID_KEYSTORE_BASE64 HEROLIST_ANDROID_KEYSTORE_PASSWORD HEROLIST_ANDROID_KEY_ALIAS HEROLIST_ANDROID_KEY_PASSWORD)
          supplied=0
          for variable in "${signing_vars[@]}"; do
            if [ -n "${!variable:-}" ]; then supplied=$((supplied + 1)); fi
          done
          if [ "$supplied" -eq 4 ]; then
            signing_file="$RUNNER_TEMP/herolist-release.jks"
            printf '%s' "$HEROLIST_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
            chmod 600 "$signing_file"
            echo "HEROLIST_ANDROID_KEYSTORE_FILE=$signing_file" >> "$GITHUB_ENV"
            echo "HEROLIST_ANDROID_BUILD=release" >> "$GITHUB_ENV"
            echo "::notice::Persistent key found: signing the stable Android release."
          elif [ "$supplied" -eq 0 ]; then
            echo "HEROLIST_ANDROID_BUILD=preview" >> "$GITHUB_ENV"
            echo "::notice::No persistent key configured. Building separately installable fun.superaistory.herolist.preview instead of breaking the installed official package."
          else
            echo "::error::Only $supplied of 4 Android signing secrets are configured. Finish setting up the release key or remove all incomplete values."
            exit 1
          fi
      - name: Build Android APK
        working-directory: standalone/android
        run: |
          if [ "$HEROLIST_ANDROID_BUILD" = release ]; then
            gradle --no-daemon :app:assembleRelease
          else
            gradle --no-daemon :app:assembleDebug
          fi
      - name: Verify Android signature and package name
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ "$HEROLIST_ANDROID_BUILD" = release ]; then
            apk=standalone/android/app/build/outputs/apk/release/app-release.apk
            expected_package=fun.superaistory.herolist
            output=release/android/HeroList-Android-Offline.apk
          else
            apk=standalone/android/app/build/outputs/apk/debug/app-debug.apk
            expected_package=fun.superaistory.herolist.preview
            output=release/android/HeroList-Android-Preview.apk
          fi
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          details=$("$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk")
          printf '%s\n' "$details" | grep -F "package: name='$expected_package'"
          mkdir -p release/android
          cp "$apk" "$output"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test APK installation on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash standalone/scripts/smoke-install-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HeroList-Android-APK
          path: release/android/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    needs: site
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: herolist-offline-static
          path: standalone/windows/site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Windows launch assets
        run: |
          python -m pip install Pillow
          python standalone/scripts/generate_branding.py --source public/favicon.ico --out .
      - name: Install desktop packaging tool
        working-directory: standalone/windows
        run: npm install --no-audit --no-fund
      - name: Build portable Windows EXE
        working-directory: standalone/windows
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: HeroList-Windows-Standalone-EXE
          path: release/windows/*.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HeroList-Android-APK
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: HeroList-Windows-Standalone-EXE
          path: release/windows
      - name: Publish standalone APK and EXE as direct release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view standalone-latest >/dev/null 2>&1 || gh release create standalone-latest --title "HeroList Offline (Android and Windows)" --notes "HeroList builds." --prerelease --target "$GITHUB_SHA"
          if [ -f release/android/HeroList-Android-Preview.apk ]; then
            gh release delete-asset standalone-latest HeroList-Android-Offline.apk --yes 2>/dev/null || true
            gh release edit standalone-latest --target "$GITHUB_SHA" --notes "ANDROID PREVIEW: debug-signed as fun.superaistory.herolist.preview, installable beside the original HeroList without uninstalling it. Saves are separate; import/export characters between the apps. Preview upgrades may need another fresh installation until a persistent release signing key is configured. Windows EXE is portable and unsigned."
          else
            gh release delete-asset standalone-latest HeroList-Android-Preview.apk --yes 2>/dev/null || true
            gh release edit standalone-latest --target "$GITHUB_SHA" --notes "Android release signed with a persistent private key. Existing legacy debug-signed apps cannot update over this release: export characters before removing them. Windows EXE is portable and unsigned."
          fi
          gh release upload standalone-latest release/android/*.apk release/windows/*.exe --clobber
