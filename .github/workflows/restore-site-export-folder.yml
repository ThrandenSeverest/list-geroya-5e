name: Restore clean site export folder

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-site-export-folder.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore exact Sites export into a clean folder
        shell: bash
        run: |
          set -euo pipefail
          test -f backup/list-geroya-5e-source.tar.gz
          gzip -t backup/list-geroya-5e-source.tar.gz
          rm -rf site-export-current
          mkdir -p site-export-current
          tar -xzf backup/list-geroya-5e-source.tar.gz -C site-export-current
          test -f site-export-current/package.json
          test -f site-export-current/package-lock.json
          find site-export-current -maxdepth 2 -type f | sort | head -200

      - name: Commit restored export folder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site-export-current
          if git diff --cached --quiet; then
            echo "Export folder is already current."
            exit 0
          fi
          git commit -m "Restore clean current Sites export folder"
          git push origin HEAD:main
