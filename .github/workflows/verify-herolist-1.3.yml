name: Verify HeroList 1.3

on:
  push:
    branches:
      - feature/1.3
    paths:
      - "hosting-update-1.3.0/**"
      - ".github/workflows/verify-herolist-1.3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hosting-update-1.3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hosting-update-1.3.0/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Verify 1.3 bundle
        run: |
          grep -R -q "Проверить персонажа" dist/client/assets
          grep -R -q "Моё хоумбрю" dist/client/assets
          grep -R -q "Время накладывания" dist/client/assets

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hosting-update-1.3.0/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hosting-update-1.3.0/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Verify migrations from an empty database
        env:
          DATABASE_URL: sqlite:///./migration-test.db
        run: alembic upgrade head
