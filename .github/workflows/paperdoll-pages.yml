name: Publish isolated Paperdoll preview
on:
  push:
    branches: [feat/paperdoll-icons]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: herolist-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/feat/paperdoll-icons'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build separate preview
        run: npm run build && node scripts/paperdoll/prepare-preview.mjs
        env:
          HEROLIST_PAGES: '1'
          NEXT_PUBLIC_BASE_PATH: /list-geroya-5e/assets/paperdoll
      - name: Publish only the Paperdoll directory
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/herolist-paperdoll origin/gh-pages
          mkdir -p /tmp/herolist-paperdoll/assets/paperdoll
          rsync -a --delete dist/client/ /tmp/herolist-paperdoll/assets/paperdoll/
          cd /tmp/herolist-paperdoll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/paperdoll
          git diff --cached --quiet || git commit -m 'Deploy isolated Paperdoll preview'
          git push origin HEAD:gh-pages
      - name: Request Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
