name: HeroList Image Inbox

# GitHub issue_comment workflows run only from main after initial merge.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: herolist-issue-image-inbox
  cancel-in-progress: false

jobs:
  import:
    if: github.event.issue.number == 19 && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: python -m pip install 'Pillow>=11,<13'
      - name: Create or select asset staging branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/assets/issue-19 >/dev/null; then
            git fetch origin assets/issue-19
            git switch -C assets/issue-19 FETCH_HEAD
          else
            git switch -c assets/issue-19
          fi
      - name: Import images from Github comment
        run: python scripts/import_images_from_issue.py
      - name: Publish images on staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/experimental/inbox/issue-19
          if git diff --cached --quiet; then
            echo "Already imported"
            exit 0
          fi
          git commit -m "assets: import issue #19 attachments"
          git push origin HEAD:assets/issue-19
