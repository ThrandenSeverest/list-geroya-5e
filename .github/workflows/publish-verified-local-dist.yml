name: Publish verified local dist

on:
  push:
    branches:
      - work/manual-local-dist-20261001
    paths:
      - .local-dist-normalized-manifest.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild from the same source
        run: npm run build
      - name: Sanitize production dist
        run: python3 scripts/sanitize-committed-dist.py
      - name: Prove rebuild matches the local compiler output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/herolist-normalized
          cp -a dist /tmp/herolist-normalized
          python3 scripts/normalize-dist-for-compare.py /tmp/herolist-normalized
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected=json.loads(Path('.local-dist-normalized-manifest.json').read_text(encoding='utf-8'))
          root=Path('/tmp/herolist-normalized')
          def ignored(path):
              return path == 'server/index.js' or path.startswith('client/assets/_vinext_fonts/')
          actual={}
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel=path.relative_to(root).as_posix()
              if not ignored(rel):
                  actual[rel]=hashlib.sha256(path.read_bytes()).hexdigest()
          wanted={path:digest for path,digest in expected['files'].items() if not ignored(path)}
          if actual != wanted:
              missing=sorted(set(wanted)-set(actual))
              extra=sorted(set(actual)-set(wanted))
              changed=sorted(k for k in set(actual)&set(wanted) if actual[k]!=wanted[k])
              raise SystemExit(f'Local-dist proof failed: missing={missing[:10]} extra={extra[:10]} changed={changed[:10]}')
          print(f"Verified {len(actual)} deterministic files against local build; Vinext runtime wrapper/fonts are covered by runtime smoke")
          PY
      - name: Write production build metadata
        shell: bash
        run: |
          source_commit="$(python3 -c "import json; print(json.load(open('.local-dist-normalized-manifest.json'))['sourceCommit'])")"
          HEROLIST_SOURCE_COMMIT="$source_commit" python3 scripts/write-build-info.py
      - name: Verify production runtime
        shell: bash
        run: |
          PORT=3997 HOST=127.0.0.1 npm start >/tmp/herolist-local-proof-runtime.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3997/ >/dev/null && curl --fail --silent http://127.0.0.1:3997/account >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/herolist-local-proof-runtime.log
          exit 1
      - name: Commit verified precompiled dist and remove bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Herolist Local Build Publisher"
          git config user.email "actions@users.noreply.github.com"
          git rm .local-dist-normalized-manifest.json .github/workflows/publish-verified-local-dist.yml
          git add -A dist
          git commit -m "build: publish locally verified dist"
          git push origin HEAD:work/manual-local-dist-20261001
