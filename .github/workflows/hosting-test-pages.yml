name: Publish hosting-test to gh-pages

on:
  push:
    branches:
      - feature/multiclass-1.1
    paths:
      - "hosting-test/**"
      - ".github/workflows/hosting-test-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "hosting-test-gh-pages"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hosting-test/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: hosting-test

      - name: Check subclass catalog
        run: npm run check:subclasses
        working-directory: hosting-test

      - name: Build static site
        run: npm run build
        working-directory: hosting-test
        env:
          NEXT_PUBLIC_BASE_PATH: /list-geroya-5e

      - name: Disable Jekyll processing
        run: touch hosting-test/out/.nojekyll

      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd hosting-test/out
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy hosting-test ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
