name: Export current site branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-portable-site.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract current source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/list-geroya-export
          mkdir -p /tmp/list-geroya-export
          gzip -t backup/list-geroya-5e-source.tar.gz
          tar -xzf backup/list-geroya-5e-source.tar.gz -C /tmp/list-geroya-export
          test -f /tmp/list-geroya-export/package.json
          test -f /tmp/list-geroya-export/package-lock.json

      - name: Build current version
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/list-geroya-export
          npm ci
          npm run build
          test -f dist/server/index.js
          test -d dist/client
          rm -rf node_modules .sites-runtime

      - name: Add hosting files
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/list-geroya-export

          cat > HOSTING.md <<'EOF'
          # Перенос текущей версии сайта

          Эта ветка содержит сохранённую текущую версию **Лист Героя 5e**:

          - обычные распакованные исходники в корне ветки;
          - `package.json` и `package-lock.json`;
          - заранее собранную серверную версию в `dist/`;
          - Dockerfile для хостинга с поддержкой Docker.

          ## Обычный Node.js-хостинг

          Команды сборки:

          ```bash
          npm ci
          npm run build
          ```

          Команда запуска:

          ```bash
          npm start
          ```

          Хостинг должен поддерживать серверное Node.js-приложение. Это не чисто статический сайт: сборка содержит `dist/client` и `dist/server`, поэтому одного `index.html` здесь нет.

          ## Docker

          ```bash
          docker build -t list-geroya-5e .
          docker run --rm -p 3000:3000 list-geroya-5e
          ```

          Для Render, Railway, Fly.io и похожих сервисов можно подключить эту ветку и использовать Dockerfile либо команды `npm ci && npm run build` / `npm start`.
          EOF

          cat > Dockerfile <<'EOF'
          FROM node:22-slim
          WORKDIR /app
          COPY package.json package-lock.json ./
          RUN npm ci
          COPY . .
          RUN npm run build
          ENV NODE_ENV=production
          ENV HOST=0.0.0.0
          ENV PORT=3000
          EXPOSE 3000
          CMD ["npm", "start"]
          EOF

          cat > .dockerignore <<'EOF'
          node_modules
          .git
          .github
          .sites-runtime
          .wrangler
          npm-debug.log*
          EOF

          cat > render.yaml <<'EOF'
          services:
            - type: web
              name: list-geroya-5e
              runtime: docker
              dockerfilePath: ./Dockerfile
              autoDeploy: false
          EOF

      - name: Publish dedicated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/list-geroya-export
          rm -rf .git
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b portable/current-site-2026-08-07
          git add -A
          git add -f dist
          git commit -m "Save current deployable site version"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/portable/current-site-2026-08-07
