name: Restore and build portable site

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-portable-site.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore complete source archive
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            refs/heads/agent/restore-current-source:refs/remotes/origin/agent/restore-current-source

          mkdir -p backup
          git show \
            origin/agent/restore-current-source:backup/list-geroya-5e-source.tar.gz \
            > backup/list-geroya-5e-source.tar.gz

          gzip -t backup/list-geroya-5e-source.tar.gz
          echo "Complete archive restored successfully."
          ls -lh backup/list-geroya-5e-source.tar.gz

      - name: Extract source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source deploy
          mkdir -p source deploy
          tar -xzf backup/list-geroya-5e-source.tar.gz -C source

          echo "Extracted project files:"
          find source -maxdepth 4 -type f | sort | sed -n '1,500p'

          PACKAGE_JSON="$(find source -name package.json -not -path '*/node_modules/*' | head -n 1 || true)"
          if [ -z "$PACKAGE_JSON" ]; then
            echo "The complete archive still contains no package.json." >&2
            exit 1
          fi

          echo "PACKAGE_JSON=$PACKAGE_JSON" >> "$GITHUB_ENV"
          echo "APP_DIR=$(dirname "$PACKAGE_JSON")" >> "$GITHUB_ENV"

      - name: Install dependencies and build
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          echo "Available scripts:"
          npm run

          if npm run | grep -qE '^  build'; then
            npm run build
          else
            echo "No build script is defined in package.json." >&2
            exit 1
          fi

          echo "Files after build:"
          find . -maxdepth 5 -type f \
            -not -path './node_modules/*' \
            | sort | sed -n '1,800p'

      - name: Create portable deploy folder
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR=""
          for candidate in \
            "$APP_DIR/dist" \
            "$APP_DIR/build" \
            "$APP_DIR/out" \
            "$APP_DIR/public" \
            "$APP_DIR/.output/public" \
            "$APP_DIR/.vinext/output/static"; do
            if [ -f "$candidate/index.html" ]; then
              OUTPUT_DIR="$candidate"
              break
            fi
          done

          if [ -z "$OUTPUT_DIR" ]; then
            INDEX_FILE="$(find "$APP_DIR" \
              -name index.html \
              -not -path '*/node_modules/*' \
              | head -n 1 || true)"
            if [ -n "$INDEX_FILE" ]; then
              OUTPUT_DIR="$(dirname "$INDEX_FILE")"
            fi
          fi

          if [ -z "$OUTPUT_DIR" ] || [ ! -f "$OUTPUT_DIR/index.html" ]; then
            echo "Build completed, but no static index.html was found." >&2
            echo "Top-level directories after build:" >&2
            find "$APP_DIR" -maxdepth 4 -type d | sort | sed -n '1,500p' >&2
            exit 1
          fi

          rm -rf deploy
          mkdir -p deploy
          cp -a "$OUTPUT_DIR"/. deploy/
          touch deploy/.nojekyll

          cat > deploy/DEPLOYMENT.md <<'EOF'
          # Переносимая версия сайта

          Папка содержит готовую статическую сборку **Лист Героя 5e**.

          Для другого хостинга опубликуйте содержимое папки `deploy`. Файл `index.html` должен находиться в корне публикации.
          EOF

          echo "Portable output: $OUTPUT_DIR"
          find deploy -maxdepth 5 -type f | sort | sed -n '1,800p'

      - name: Save source and portable build to GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backup/list-geroya-5e-source.tar.gz source deploy

          if git diff --cached --quiet; then
            echo "Source and deploy folders are already current."
          else
            git commit -m "Restore source and add portable deploy build"
            git push origin HEAD:main
          fi
