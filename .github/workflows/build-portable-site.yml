name: Build portable site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover source tree
        shell: bash
        run: |
          set -u
          rm -rf source deploy
          mkdir -p source deploy

          ARCHIVE="backup/list-geroya-5e-source.tar.gz"

          if gzip -t "$ARCHIVE" 2>/dev/null; then
            echo "Archive is valid; extracting normally."
            tar -xzf "$ARCHIVE" -C source
          else
            echo "Archive is truncated; recovering all readable files."
            set +e
            gzip -dc "$ARCHIVE" 2>gzip-recovery.log | tar -xvf - -C source --ignore-zeros
            RECOVERY_STATUS=$?
            set -e
            echo "Recovery command status: $RECOVERY_STATUS"
            cat gzip-recovery.log || true
          fi

          echo "Recovered files:"
          find source -maxdepth 5 -type f | sort | sed -n '1,400p'

          if ! find source -type f -print -quit | grep -q .; then
            echo "No files could be recovered from the archive." >&2
            exit 1
          fi

      - name: Build portable site
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_JSON="$(find source -name package.json -not -path '*/node_modules/*' | head -n 1 || true)"
          OUTPUT_DIR=""

          if [ -n "$PACKAGE_JSON" ]; then
            APP_DIR="$(dirname "$PACKAGE_JSON")"
            echo "Application directory: $APP_DIR"
            cd "$APP_DIR"

            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            if npm run | grep -qE '^  build'; then
              npm run build
            else
              echo "No build script found; treating the recovered files as a static site."
            fi

            cd "$GITHUB_WORKSPACE"

            for candidate in \
              "$APP_DIR/dist" \
              "$APP_DIR/build" \
              "$APP_DIR/out" \
              "$APP_DIR/public"; do
              if [ -f "$candidate/index.html" ]; then
                OUTPUT_DIR="$candidate"
                break
              fi
            done

            if [ -z "$OUTPUT_DIR" ]; then
              INDEX_FILE="$(find "$APP_DIR" -name index.html -not -path '*/node_modules/*' | head -n 1 || true)"
              if [ -n "$INDEX_FILE" ]; then
                OUTPUT_DIR="$(dirname "$INDEX_FILE")"
              fi
            fi
          else
            INDEX_FILE="$(find source -name index.html | head -n 1 || true)"
            if [ -n "$INDEX_FILE" ]; then
              OUTPUT_DIR="$(dirname "$INDEX_FILE")"
            fi
          fi

          if [ -z "$OUTPUT_DIR" ] || [ ! -f "$OUTPUT_DIR/index.html" ]; then
            echo "Could not find a complete deployable site with index.html." >&2
            exit 1
          fi

          rm -rf deploy
          mkdir -p deploy
          cp -a "$OUTPUT_DIR"/. deploy/
          touch deploy/.nojekyll

          cat > deploy/DEPLOYMENT.md <<'EOF'
          # Переносимая версия сайта

          Эта папка содержит готовую статическую сборку **Лист Героя 5e**.

          Для размещения на другом хостинге загрузите содержимое папки `deploy` и укажите её как корневую папку сайта. Файл `index.html` должен находиться в корне публикации.

          Подходит для Netlify, Cloudflare Pages, Vercel, GitHub Pages и обычного веб-сервера.
          EOF

          echo "Deploy contents:"
          find deploy -maxdepth 5 -type f | sort | sed -n '1,500p'

      - name: Commit portable build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy

          if git diff --cached --quiet; then
            echo "Portable build is already up to date."
          else
            git commit -m "Add recovered portable deploy build"
            git push origin HEAD:main
          fi
