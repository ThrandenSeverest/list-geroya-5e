name: Extract source for update

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract current source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted-source
          gzip -t backup/list-geroya-5e-source.tar.gz
          tar -xzf backup/list-geroya-5e-source.tar.gz -C extracted-source
          test -f extracted-source/package.json
          find extracted-source -maxdepth 3 -type f | sort

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: extracted-source
          path: extracted-source
          include-hidden-files: true
          retention-days: 3
