name: Publish GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'tests/mobile-*.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'next.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: herolist-pages
  # Direct push publishes only the latest main source. Older in-flight builds
  # can be discarded instead of delaying current mobile fixes.
  cancel-in-progress: true
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static test site
        run: npm run build
        env:
          HEROLIST_PAGES: "1"
          NEXT_PUBLIC_BASE_PATH: /list-geroya-5e
      - name: Prepare Pages files
        run: |
          find dist/client -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec sed -i -e 's#href="/assets/_vinext_fonts#href="/list-geroya-5e/assets/_vinext_fonts#g' -e 's#url(/assets/_vinext_fonts#url(/list-geroya-5e/assets/_vinext_fonts#g' {} +
          touch dist/client/.nojekyll
          python3 scripts/write-build-info.py
          cp dist/BUILD_INFO.json dist/client/BUILD_INFO.json
      - name: Verify static desktop and mobile flows
        run: |
          npm install --prefix /tmp/herolist-browser --no-save --package-lock=false playwright@1.51.1
          /tmp/herolist-browser/node_modules/.bin/playwright install chromium
          mkdir -p /tmp/herolist-pages-preview
          ln -s "$GITHUB_WORKSPACE/dist/client" /tmp/herolist-pages-preview/list-geroya-5e
          python3 -m http.server 3997 --bind 127.0.0.1 --directory /tmp/herolist-pages-preview >/tmp/herolist-pages-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3997/list-geroya-5e/ >/dev/null; then
              HEROLIST_URL=http://127.0.0.1:3997/list-geroya-5e/ PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node tests/browser-sheet.cjs
              HEROLIST_URL=http://127.0.0.1:3997/list-geroya-5e/ PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node tests/mobile-layout.cjs
              HEROLIST_URL=http://127.0.0.1:3997/list-geroya-5e/ PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node tests/mobile-tavern.cjs
              HEROLIST_URL=http://127.0.0.1:3997/list-geroya-5e/ PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node tests/mobile-hydration.cjs
              HEROLIST_URL=http://127.0.0.1:3997/list-geroya-5e/ PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node tests/homebrew-browser.cjs
              HEROLIST_URL=http://127.0.0.1:3997/list-geroya-5e/ PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node tests/homebrew-relations-browser.cjs
              HEROLIST_URL=http://127.0.0.1:3997/list-geroya-5e/ PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node tests/homebrew-magic-browser.cjs
              HEROLIST_URL=http://127.0.0.1:3997/list-geroya-5e/ PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node tests/homebrew-auto-relations-browser.cjs
              HEROLIST_URL=http://127.0.0.1:3997/list-geroya-5e/ PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node tests/homebrew-workshop-browser.cjs
              exit 0
            fi
            sleep 1
          done
          cat /tmp/herolist-pages-preview.log
          exit 1
      - name: Update Pages branch
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/herolist-pages origin/gh-pages
          # Mobile browsers may cache an older HTML shell after a deployment.
          # Never delete its content-hashed JS/CSS chunks: otherwise the native
          # hamburger still opens but every React-controlled button is dead.
          # Keep the assets directory across releases, replacing only changed files.
          rsync -a --delete --exclude=.git --exclude=/assets/ dist/client/ /tmp/herolist-pages/
          rsync -a dist/client/assets/ /tmp/herolist-pages/assets/
          cd /tmp/herolist-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy verified main ${{ github.sha }}"
          git push origin HEAD:gh-pages
      - name: Verify live Pages artifact after deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pushing gh-pages already triggers the Pages deployment. Calling
          # POST /pages/builds again races with GitHub's own automatic build.
          # The builds/latest API can stay queued after a successful deploy,
          # so validate the real hosted BUILD_INFO.json rather than that state.
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')
          case "$site" in
            */) ;;
            *) site="$site/" ;;
          esac
          for attempt in $(seq 1 48); do
            if curl --fail --location --silent --show-error --max-time 15 \
              --header 'Cache-Control: no-cache' \
              "${site}BUILD_INFO.json?source=${GITHUB_SHA}&check=${attempt}" \
              -o /tmp/published-build-info.json; then
              if cmp -s dist/client/BUILD_INFO.json /tmp/published-build-info.json; then
                echo "Verified LIVE Pages artifact at ${site} on attempt ${attempt}"
                cat /tmp/published-build-info.json
                exit 0
              fi
            fi
            echo "Pages still propagating (attempt ${attempt}/48)"
            sleep 10
          done
          echo "The live site did not serve this build after polling" >&2
          gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" || true
          echo "Expected:" >&2
          cat dist/client/BUILD_INFO.json >&2
          echo "Last response:" >&2
          cat /tmp/published-build-info.json >&2 || true
          exit 1
