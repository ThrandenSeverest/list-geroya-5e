name: Prepare editable source branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack saved site source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/list-geroya-source
          mkdir -p /tmp/list-geroya-source
          gzip -t backup/list-geroya-5e-source.tar.gz
          tar -xzf backup/list-geroya-5e-source.tar.gz -C /tmp/list-geroya-source
          test -f /tmp/list-geroya-source/package.json
          test -f /tmp/list-geroya-source/app/featureDetails.ts
          test -f /tmp/list-geroya-source/app/exportFormats.ts

      - name: Publish editable source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/list-geroya-source
          rm -rf .git node_modules dist .sites-runtime .wrangler
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b agent/update-class-feature-texts
          git add -A
          git commit -m "Unpack current site source for class feature update"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/agent/update-class-feature-texts
