name: Verify HeroList

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

# Only the newest verification for a branch may publish dist. This prevents
# older runs from racing a newer main commit and failing with a non-fast-forward push.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve committed production build
        run: cp -a dist /tmp/herolist-committed-dist
      - name: Verify precompiled production runtime
        run: |
          npm ci --omit=dev --ignore-scripts
          PORT=3999 HOST=127.0.0.1 npm start >/tmp/herolist-frontend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3999/ >/dev/null && curl --fail --silent http://127.0.0.1:3999/account >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/herolist-frontend.log
          exit 1
      - run: npm ci
      - run: npm run build
      - name: Sync precompiled dist on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- dist; then
            echo "Committed dist already matches the source build."
            exit 0
          fi

          # A newer commit may have landed while this build was running.
          # Never publish dist compiled from an older source tree onto newer main.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during this run; the newer workflow will publish its own dist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "build: sync precompiled dist"
          git push origin HEAD:main
      - name: Verify committed dist matches source on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/normalize-dist-for-compare.py /tmp/herolist-committed-dist dist
          diff -qr /tmp/herolist-committed-dist dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest
        working-directory: backend
