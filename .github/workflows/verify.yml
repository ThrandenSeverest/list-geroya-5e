name: Verify HeroList

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep only the newest verification for a branch. CI is read-only: dist is built
# locally before merge and is only compared with an independent rebuild here.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package source snapshot for external/local builds
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/herolist-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: herolist-source-${{ github.sha }}
          path: /tmp/herolist-source.tgz
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve committed production build
        run: cp -a dist /tmp/herolist-committed-dist
      - name: Verify committed dist is sanitized before runtime starts
        run: python3 scripts/check-sanitized-dist.py
      - name: Verify precompiled production runtime
        run: |
          npm ci --omit=dev --ignore-scripts
          PORT=3999 HOST=127.0.0.1 npm start >/tmp/herolist-frontend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3999/ >/dev/null && curl --fail --silent http://127.0.0.1:3999/account >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/herolist-frontend.log
          exit 1
      - run: npm ci
      - name: Package exact build dependencies for local compiler
        if: github.event_name == 'pull_request'
        run: tar -czf /tmp/herolist-node-modules.tgz node_modules
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: herolist-build-deps-${{ github.sha }}
          path: /tmp/herolist-node-modules.tgz
          retention-days: 1
      - name: Prepare classic sheet artwork
        run: bash scripts/prepare-classic-sheet-assets.sh
      - run: npm run build
      - name: Finalize production build metadata and runtime placeholders
        run: |
          python3 scripts/sanitize-committed-dist.py
          python3 scripts/write-build-info.py
      - name: Verify PDF screen and print layout
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        run: |
          npm install --prefix /tmp/herolist-browser --no-save --package-lock=false playwright@1.51.1
          /tmp/herolist-browser/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node tests/pdf-layout/check.cjs
      - name: Verify newly built production runtime
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        run: |
          # Startup rotates runtime secrets. Test a copy so the published build is untouched.
          mkdir -p /tmp/herolist-built-runtime
          cp -a dist deployment package.json /tmp/herolist-built-runtime/
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/herolist-built-runtime/node_modules
          cd /tmp/herolist-built-runtime
          PORT=3998 HOST=127.0.0.1 npm start >/tmp/herolist-built-frontend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3998/ >/dev/null && curl --fail --silent http://127.0.0.1:3998/account >/dev/null; then
              PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node "$GITHUB_WORKSPACE/tests/browser-sheet.cjs"
              HEROLIST_URL=http://127.0.0.1:3998 PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node "$GITHUB_WORKSPACE/tests/mobile-tavern.cjs"
              HEROLIST_URL=http://127.0.0.1:3998 PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node "$GITHUB_WORKSPACE/tests/homebrew-browser.cjs"
              HEROLIST_URL=http://127.0.0.1:3998 PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node "$GITHUB_WORKSPACE/tests/homebrew-relations-browser.cjs"
              HEROLIST_URL=http://127.0.0.1:3998 PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node "$GITHUB_WORKSPACE/tests/homebrew-magic-browser.cjs"
              HEROLIST_URL=http://127.0.0.1:3998 PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node "$GITHUB_WORKSPACE/tests/homebrew-auto-relations-browser.cjs"
              HEROLIST_URL=http://127.0.0.1:3998 PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node "$GITHUB_WORKSPACE/tests/homebrew-workshop-browser.cjs"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/herolist-built-frontend.log
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest
        working-directory: backend
      - name: Verify committed dist matches source
        run: |
          # Vinext fingerprints filenames on every build. The normalizer
          # checks the complete canonical runtime inventory, including asset
          # references, without treating random chunk filenames as changes.
          python3 scripts/normalize-dist-for-compare.py /tmp/herolist-committed-dist dist

  # Isolated experimental preview, never publish over the main Pages root.
  dice_preview:
    if: github.event_name == 'pull_request' && github.head_ref == 'test/screen-dice-animation-2026-11-22'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check artwork
        run: bash scripts/prepare-classic-sheet-assets.sh
      - name: Compile independent Pages preview
        run: npm run build
        env:
          HEROLIST_PAGES: '1'
          NEXT_PUBLIC_BASE_PATH: /list-geroya-5e/dice-preview
      - name: Fix font URLs and prepare preview
        run: |
          find dist/client -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -exec sed -i             -e 's#href="/assets/_vinext_fonts#href="/list-geroya-5e/dice-preview/assets/_vinext_fonts#g'             -e 's#url(/assets/_vinext_fonts#url(/list-geroya-5e/dice-preview/assets/_vinext_fonts#g' {} +
          touch dist/client/.nojekyll
          echo "dice-preview build ${GITHUB_SHA}" > dist/client/DICE_PREVIEW_BUILD.txt
      - name: Publish only dice-preview subfolder
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/herolist-preview-pages origin/gh-pages
          mkdir -p /tmp/herolist-preview-pages/dice-preview
          rsync -a --delete --exclude=.git dist/client/ /tmp/herolist-preview-pages/dice-preview/
          cd /tmp/herolist-preview-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dice-preview/
          git diff --cached --quiet || git commit -m "Publish dice-preview ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
      - name: Verify preview URL
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error --max-time 15               "https://thrandenseverest.github.io/list-geroya-5e/dice-preview/DICE_PREVIEW_BUILD.txt?attempt=${attempt}"               | grep -q "${GITHUB_SHA}"; then
              echo "Preview live: https://thrandenseverest.github.io/list-geroya-5e/dice-preview/"
              exit 0
            fi
            sleep 10
          done
          echo "Preview not yet propagated" >&2
          exit 1
