name: Verify HeroList

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep only the newest verification for a branch. CI is read-only: dist is built
# locally before merge and is only compared with an independent rebuild here.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source snapshot for external/local builds
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/herolist-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: herolist-source-${{ github.sha }}
          path: /tmp/herolist-source.tgz
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve committed production build
        run: cp -a dist /tmp/herolist-committed-dist
      - name: Verify precompiled production runtime
        run: |
          npm ci --omit=dev --ignore-scripts
          PORT=3999 HOST=127.0.0.1 npm start >/tmp/herolist-frontend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3999/ >/dev/null && curl --fail --silent http://127.0.0.1:3999/account >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/herolist-frontend.log
          exit 1
      - run: npm ci
      - name: Package exact build dependencies for local compiler
        if: github.event_name == 'pull_request'
        run: tar -czf /tmp/herolist-node-modules.tgz node_modules
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: herolist-build-deps-${{ github.sha }}
          path: /tmp/herolist-node-modules.tgz
          retention-days: 1
      - run: npm run build
      - name: Finalize production build metadata and runtime placeholders
        run: |
          python3 scripts/sanitize-committed-dist.py
          python3 scripts/write-build-info.py
      - name: Verify PDF screen and print layout
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        run: |
          npm install --prefix /tmp/herolist-browser --no-save --package-lock=false playwright@1.51.1
          /tmp/herolist-browser/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node tests/pdf-layout/check.cjs
      - name: Verify newly built production runtime
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        run: |
          # Startup rotates runtime secrets. Test a copy so the published build is untouched.
          mkdir -p /tmp/herolist-built-runtime
          cp -a dist deployment package.json /tmp/herolist-built-runtime/
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/herolist-built-runtime/node_modules
          cd /tmp/herolist-built-runtime
          PORT=3998 HOST=127.0.0.1 npm start >/tmp/herolist-built-frontend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3998/ >/dev/null && curl --fail --silent http://127.0.0.1:3998/account >/dev/null; then
              PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node "$GITHUB_WORKSPACE/tests/browser-sheet.cjs"
              HEROLIST_URL=http://127.0.0.1:3998 PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node "$GITHUB_WORKSPACE/tests/homebrew-browser.cjs"
              HEROLIST_URL=http://127.0.0.1:3998 PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node "$GITHUB_WORKSPACE/tests/homebrew-relations-browser.cjs"
              HEROLIST_URL=http://127.0.0.1:3998 PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node "$GITHUB_WORKSPACE/tests/homebrew-magic-browser.cjs"
              HEROLIST_URL=http://127.0.0.1:3998 PLAYWRIGHT_MODULE=/tmp/herolist-browser/node_modules/playwright node "$GITHUB_WORKSPACE/tests/homebrew-auto-relations-browser.cjs"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/herolist-built-frontend.log
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest
        working-directory: backend
      - name: Verify committed dist matches source
        run: |
          python3 scripts/normalize-dist-for-compare.py /tmp/herolist-committed-dist dist
          diff -qr /tmp/herolist-committed-dist dist
