name: Build production 1.2.1 hosting folder

on:
  workflow_dispatch:
  push:
    branches:
      - feature/multiclass-1.1
    paths:
      - "hosting-update-1.2.1/app/**"
      - ".github/workflows/build-production-1.1.2.yml"

permissions:
  contents: write

concurrency:
  group: "production-1.1.2-dist"
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hosting-update-1.2.1/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: hosting-update-1.2.1

      - name: Check subclass catalog
        run: npm run check:subclasses
        working-directory: hosting-update-1.2.1

      - name: Clean old dist
        run: rm -rf dist
        working-directory: hosting-update-1.2.1

      - name: Build production dist
        run: npm run build
        working-directory: hosting-update-1.2.1

      - name: Verify build output
        run: |
          test -d hosting-update-1.2.1/dist
          test -n "$(find hosting-update-1.2.1/dist -type f -print -quit)"
          echo "Production dist contains $(find hosting-update-1.2.1/dist -type f | wc -l) files"

      - name: Commit built dist and hosting update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hosting-update-1.2.1/dist
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "build: refresh production dist for hosting update 1.2.1"
          git push origin HEAD:feature/multiclass-1.1
