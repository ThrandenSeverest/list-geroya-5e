name: Test one-file PDF feature tables

on:
  push:
    branches: ["test/pdf-feature-tables-one-file"]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply production candidate to PdfCharacterSheet only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/PdfCharacterSheet.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''function FeatureList({ features }: { features: Feature[] }) {
            return <div className="pdf-feature-list">
              {features.map((feature, index) => <article key={`${feature.name}-${index}`}>
                <h3>{feature.name}</h3>
                <p>{compactRulesText(feature.description)}</p>
              </article>)}
            </div>;
          }

          function featureWeight(feature: Feature) {
            const text = compactRulesText(feature.description);
            return 92 + Math.ceil(text.length / 58) * 18;
          }
          '''
          new = '''type ParsedFeatureTable = {
            prefix: string;
            suffix: string;
            header: string[];
            rows: string[][];
          };

          function cleanFeatureTableCell(value: string) {
            return value
              .trim()
              .replace(/\\*\\*/g, "")
              .replace(/__/g, "")
              .replace(/`/g, "")
              .trim();
          }

          function parseFeatureTable(value: string): ParsedFeatureTable | null {
            const text = compactRulesText(value);
            const start = text.indexOf("|");
            const end = text.lastIndexOf("|");
            if (start < 0 || end <= start) return null;

            const tableText = text.slice(start, end + 1).replace(/\\|\\s+\\|/g, "|\\n|");
            const rows = tableText
              .split(/\\r?\\n+/)
              .map(line => line.trim())
              .filter(line => line.startsWith("|") && line.endsWith("|"))
              .map(line => line.slice(1, -1).split("|").map(cleanFeatureTableCell));

            const separatorIndex = rows.findIndex(row =>
              row.length >= 2 && row.every(cell => /^:?-{3,}:?$/.test(cell)),
            );
            if (separatorIndex < 1) return null;

            const header = rows[separatorIndex - 1];
            const body = rows.slice(separatorIndex + 1).filter(row =>
              row.length === header.length && row.some(Boolean),
            );
            if (header.length < 2 || body.length < 1) return null;

            return {
              prefix: text.slice(0, start).trim(),
              suffix: text.slice(end + 1).trim(),
              header,
              rows: body,
            };
          }

          function FeatureDescription({ description }: { description: string }) {
            const parsed = parseFeatureTable(description);
            if (!parsed) return <p>{compactRulesText(description)}</p>;

            const columns = parsed.header.length;
            const density = columns >= 6 ? 4.8 : parsed.rows.length >= 8 ? 4.9 : parsed.rows.length >= 5 ? 5.3 : 5.8;
            const cellStyle = {
              padding: ".55mm .65mm",
              border: ".22mm solid rgba(23,61,67,.35)",
              verticalAlign: "top" as const,
              whiteSpace: "normal" as const,
              overflowWrap: "anywhere" as const,
              wordBreak: "normal" as const,
            };

            return <div style={{ minWidth: 0, margin: 0, lineHeight: 1.25 }}>
              {parsed.prefix && <p style={{ margin: "0 0 1mm", fontSize: "7pt", lineHeight: 1.32 }}>{parsed.prefix}</p>}
              <table style={{ width: "100%", tableLayout: "fixed", borderCollapse: "collapse", fontSize: `${density}pt`, lineHeight: 1.14, margin: "1mm 0 0" }}>
                <thead>
                  <tr>{parsed.header.map((cell, index) => <th key={index} style={{ ...cellStyle, color: "#173d43", background: "rgba(23,61,67,.08)", fontWeight: 700, textAlign: "left" }}>{cell}</th>)}</tr>
                </thead>
                <tbody>
                  {parsed.rows.map((row, rowIndex) => <tr key={rowIndex} style={{ breakInside: "avoid" }}>
                    {row.map((cell, cellIndex) => <td key={cellIndex} style={{ ...cellStyle, color: "#263b3d", background: rowIndex % 2 ? "rgba(164,99,62,.035)" : "rgba(255,255,255,.28)" }}>{cell}</td>)}
                  </tr>)}
                </tbody>
              </table>
              {parsed.suffix && <p style={{ margin: "1mm 0 0", fontSize: "7pt", lineHeight: 1.32 }}>{parsed.suffix}</p>}
            </div>;
          }

          function FeatureList({ features }: { features: Feature[] }) {
            return <div className="pdf-feature-list">
              {features.map((feature, index) => <article key={`${feature.name}-${index}`}>
                <h3>{feature.name}</h3>
                <FeatureDescription description={feature.description} />
              </article>)}
            </div>;
          }

          function featureWeight(feature: Feature) {
            const text = compactRulesText(feature.description);
            const parsed = parseFeatureTable(feature.description);
            if (!parsed) return 92 + Math.ceil(text.length / 58) * 18;

            const proseLength = parsed.prefix.length + parsed.suffix.length;
            const charsPerCellLine = Math.max(12, Math.floor(72 / parsed.header.length));
            const headerLines = Math.max(...parsed.header.map(cell => Math.max(1, Math.ceil(cell.length / charsPerCellLine))));
            const bodyLines = parsed.rows.reduce((total, row) => {
              const rowLines = Math.max(...row.map(cell => Math.max(1, Math.ceil(cell.length / charsPerCellLine))));
              return total + rowLines;
            }, 0);
            const tableWeight = 36 + (headerLines + bodyLines) * 18;
            return 92 + Math.ceil(proseLength / 58) * 18 + tableWeight;
          }
          '''
          if old not in text:
            raise SystemExit("Expected PdfCharacterSheet block not found; aborting")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Prove production candidate changes one source file only
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "app/PdfCharacterSheet.tsx"

      - name: Prepare temporary GitHub Pages config
        shell: bash
        run: |
          cp next.config.ts /tmp/next.config.ts
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            basePath: "/list-geroya-5e",
            assetPrefix: "/list-geroya-5e",
            images: { unoptimized: true },
          };

          export default nextConfig;
          EOF

      - name: Build coherent test candidate
        run: npm run build

      - name: Restore production config and re-check one-file diff
        shell: bash
        run: |
          cp /tmp/next.config.ts next.config.ts
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "app/PdfCharacterSheet.tsx"

      - name: Render the real root page from the built Vinext server
        shell: bash
        run: |
          HOST=127.0.0.1 PORT=4173 npm start >/tmp/herolist-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          ok=0
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:4173/list-geroya-5e/" -o /tmp/herolist-index.html; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" != "1" ]; then
            cat /tmp/herolist-test-server.log
            exit 1
          fi

          test "$(wc -c </tmp/herolist-index.html)" -gt 1000
          grep -q "Твоя история начинается здесь" /tmp/herolist-index.html

      - name: Assemble one consistent anonymous GitHub Pages build
        shell: bash
        run: |
          rm -rf .pages-test
          mkdir -p .pages-test
          cp -R dist/client/. .pages-test/
          cp -R public/. .pages-test/
          cp /tmp/herolist-index.html .pages-test/index.html
          cp /tmp/herolist-index.html .pages-test/404.html
          touch .pages-test/.nojekyll

          python3 - <<'PY'
          from pathlib import Path

          test_layer = r'''
          <style id="herolist-gh-pages-test-style">
            .account-state, .account-warning, .mobile-top-menu a[href="/account"] { display: none !important; }
            .app-shell.modern-design { background: linear-gradient(rgba(246,235,203,.84), rgba(238,218,173,.88)), url('/list-geroya-5e/parchment-background.jpg') center top / cover fixed !important; }
          </style>
          <script id="herolist-gh-pages-test-api">
          (() => {
            const nativeFetch = window.fetch.bind(window);
            window.fetch = (input, init) => {
              const raw = typeof input === "string" ? input : input instanceof Request ? input.url : String(input);
              const method = String(init?.method || (input instanceof Request ? input.method : "GET")).toUpperCase();
              let path = raw;
              try { path = new URL(raw, window.location.href).pathname; } catch {}
              if (path === "/api/account" || path.endsWith("/api/account")) {
                return Promise.resolve(new Response(JSON.stringify({ authenticated: false, cloudSyncEnabled: false }), { status: 200, headers: { "content-type": "application/json" } }));
              }
              if (path === "/api/vault" || path.endsWith("/api/vault")) {
                return Promise.resolve(new Response(JSON.stringify(method === "GET" ? { vault: null, updatedAt: null } : { error: "Cloud sync is disabled in the GitHub Pages test" }), { status: method === "GET" ? 200 : 404, headers: { "content-type": "application/json" } }));
              }
              if (path === "/api/homebrew" || path.endsWith("/api/homebrew")) {
                return Promise.resolve(new Response(JSON.stringify(method === "GET" ? { library: { version: 1, elements: [] }, updatedAt: null } : { error: "Cloud homebrew is disabled in the GitHub Pages test" }), { status: method === "GET" ? 200 : 404, headers: { "content-type": "application/json" } }));
              }
              if (path.includes("/api/auth/")) {
                return Promise.resolve(new Response(JSON.stringify({ error: "Authentication is disabled in the GitHub Pages test" }), { status: 404, headers: { "content-type": "application/json" } }));
              }
              return nativeFetch(input, init);
            };
          })();
          </script>
          '''

          for filename in ("index.html", "404.html"):
            path = Path(".pages-test") / filename
            html = path.read_text(encoding="utf-8")
            if "</head>" not in html:
              raise SystemExit(f"{filename}: missing </head>")
            html = html.replace("</head>", test_layer + "</head>", 1)
            html = html.replace("<title>Лист Героя 5e", "<title>Лист Героя 5e 1.4 — тест ·", 1)
            path.write_text(html, encoding="utf-8")
          PY

          grep -q '/list-geroya-5e/assets/' .pages-test/index.html

      - name: Publish complete build to the existing test site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./.pages-test
          keep_files: false
