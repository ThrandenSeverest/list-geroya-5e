name: Test PDF tables and LSS export layout

on:
  push:
    branches: ["test/pdf-feature-tables-one-file"]

permissions:
  contents: write

concurrency:
  group: "herolist-gh-pages-test"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply PDF table candidate
        run: python3 scripts/test_apply_pdf_table_patch.py

      - name: Apply LSS compact-sheet/full-notes candidate
        run: python3 scripts/test_apply_lss_sheet_notes_patch.py

      - name: Prove test candidates touch only the intended production files
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' app/PdfCharacterSheet.tsx app/exportFormats.ts | sort)"
          test "$changed" = "$expected"

      - name: Prepare temporary GitHub Pages config
        shell: bash
        run: |
          cp next.config.ts /tmp/next.config.ts
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            basePath: "/list-geroya-5e",
            assetPrefix: "/list-geroya-5e",
            images: { unoptimized: true },
          };

          export default nextConfig;
          EOF

      - name: Build coherent test candidate
        run: npm run build

      - name: Restore production config and re-check candidate diff
        shell: bash
        run: |
          cp /tmp/next.config.ts next.config.ts
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' app/PdfCharacterSheet.tsx app/exportFormats.ts | sort)"
          test "$changed" = "$expected"

      - name: Render the real root page from the built Vinext server
        shell: bash
        run: |
          HOST=127.0.0.1 PORT=4173 npm start >/tmp/herolist-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          ok=0
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:4173/list-geroya-5e/" -o /tmp/herolist-index.html; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" != "1" ]; then
            cat /tmp/herolist-test-server.log
            exit 1
          fi

          test "$(wc -c </tmp/herolist-index.html)" -gt 1000
          grep -q "Твоя история начинается здесь" /tmp/herolist-index.html

      - name: Assemble and verify one consistent anonymous GitHub Pages build
        shell: bash
        run: |
          rm -rf .pages-test
          mkdir -p .pages-test
          cp -R dist/client/. .pages-test/
          cp -R public/. .pages-test/
          cp /tmp/herolist-index.html .pages-test/index.html
          cp /tmp/herolist-index.html .pages-test/404.html
          touch .pages-test/.nojekyll
          python3 scripts/test_prepare_gh_pages.py

      - name: Publish complete build to the existing test site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./.pages-test
          keep_files: false
