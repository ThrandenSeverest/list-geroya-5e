name: Apply skill dedupe and PDF hotfix

on:
  push:
    branches:
      - feature/multiclass-1.1
    paths:
      - ".github/hotfix-skill-pdf.trigger"

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/multiclass-1.1
          fetch-depth: 0

      - name: Apply source fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path("export-1.1.0-python-sqlite")

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Patch anchor not found: {label} in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          feat = root / "app/featChoices.ts"
          replace_once(
              feat,
              'import { generatedFeats } from "./generatedRulesCorpus";\n',
              'import { generatedFeats } from "./generatedRulesCorpus";\nimport { characterExpertiseSkills, characterProficiencies } from "./proficiencies";\n',
              "feat proficiency imports",
          )
          old_complete = '''export function advancementChoiceComplete(choiceValue: AdvancementChoice, spells: CatalogSpell[], characterLevel = choiceValue.level) {
            if (!choiceValue.featId) return false;
            if (choiceValue.featId === "asi") return choiceValue.asiChoices.length === 2;
            return featChoiceGroups(choiceValue, spells, characterLevel).every(group => (choiceValue.featChoices?.[group.key] || []).length === group.count);
          }'''
          new_complete = '''export function featChoiceAvailability(choiceValue: AdvancementChoice, group: FeatChoiceGroup, character?: ExportCharacter) {
            const proficiencyGroup = group.key === "skill" || group.key === "proficiencies" || group.key === "expertise";
            if (!character || !proficiencyGroup) return { options: group.options, count: group.count };

            const baseline: ExportCharacter = {
              ...character,
              advancements: (character.advancements || []).map(item => item.key === choiceValue.key
                ? { ...item, featChoices: { ...(item.featChoices || {}), [group.key]: [] } }
                : item),
            };
            const known = characterProficiencies(baseline);
            const ownedSkills = new Set(known.skills);
            const ownedTools = new Set(known.tools);
            const ownedExpertise = new Set(characterExpertiseSkills(baseline));
            let options = group.options;

            if (group.key === "skill") options = group.options.filter(option => !ownedSkills.has(option.id));
            if (group.key === "proficiencies") options = group.options.filter(option => !ownedSkills.has(option.id) && !ownedTools.has(option.id));
            if (group.key === "expertise") options = group.options.filter(option => ownedSkills.has(option.id) && !ownedExpertise.has(option.id));

            return { options, count: Math.min(group.count, options.length) };
          }

          export function advancementChoiceComplete(choiceValue: AdvancementChoice, spells: CatalogSpell[], characterLevel = choiceValue.level, character?: ExportCharacter) {
            if (!choiceValue.featId) return false;
            if (choiceValue.featId === "asi") return choiceValue.asiChoices.length === 2;
            return featChoiceGroups(choiceValue, spells, characterLevel).every(group => {
              const selected = choiceValue.featChoices?.[group.key] || [];
              const availability = featChoiceAvailability(choiceValue, group, character);
              const allowed = new Set(availability.options.map(option => option.id));
              return selected.length === availability.count
                && new Set(selected).size === selected.length
                && selected.every(id => allowed.has(id));
            });
          }'''
          replace_once(feat, old_complete, new_complete, "advancement completion")

          page = root / "app/page.tsx"
          text = page.read_text(encoding="utf-8")
          old_import = 'import { advancementChoiceComplete, featChoiceGroups, featGrantedSpellIds } from "./featChoices";'
          new_import = 'import { advancementChoiceComplete, featChoiceAvailability, featChoiceGroups, featGrantedSpellIds } from "./featChoices";'
          if old_import not in text:
              raise SystemExit("page featChoices import anchor missing")
          text = text.replace(old_import, new_import, 1)

          old_toggle = '''      const selected = target.featChoices?.[groupKey] || [];
                const ownedSkills = new Set(characterProficiencies(current).skills);
                if (!selected.includes(id) && groupKey === "skill" && ownedSkills.has(id)) return current;
                if (!selected.includes(id) && groupKey === "expertise" && !ownedSkills.has(id)) return current;
                const nextSelected = selected.includes(id)
                  ? selected.filter(value => value !== id)
                  : selected.length < limit ? [...selected, id] : limit === 1 ? [id] : selected;'''
          new_toggle = '''      const selected = target.featChoices?.[groupKey] || [];
                const known = characterProficiencies(current);
                const ownedSkills = new Set(known.skills);
                const ownedTools = new Set(known.tools);
                const ownedExpertise = new Set(characterExpertiseSkills(current));
                if (!selected.includes(id) && groupKey === "skill" && ownedSkills.has(id)) return current;
                if (!selected.includes(id) && groupKey === "proficiencies" && (ownedSkills.has(id) || ownedTools.has(id))) return current;
                if (!selected.includes(id) && groupKey === "expertise" && (!ownedSkills.has(id) || ownedExpertise.has(id))) return current;
                const nextSelected = selected.includes(id)
                  ? selected.filter(value => value !== id)
                  : selected.length < limit ? [...selected, id] : limit === 1 ? [id] : selected;'''
          if old_toggle not in text:
              raise SystemExit("toggleFeatChoice anchor missing")
          text = text.replace(old_toggle, new_toggle, 1)

          old_options = '''                        const selected = activeAdvancement.featChoices?.[group.key] || [];
                                  const ownedSkills = new Set(proficiencies.skills);
                                  const options = group.key === "expertise"
                                    ? group.options.filter(option => ownedSkills.has(option.id) || selected.includes(option.id))
                                    : (group.key === "skill" || group.key === "proficiencies")
                                      ? group.options.filter(option => !ownedSkills.has(option.id) || selected.includes(option.id))
                                      : group.options;'''
          new_options = '''                        const selected = activeAdvancement.featChoices?.[group.key] || [];
                                  const availability = featChoiceAvailability(activeAdvancement, group, character);
                                  const allowedOptionIds = new Set(availability.options.map(option => option.id));
                                  const options = group.options;
                                  const requiredCount = availability.count;'''
          if old_options not in text:
              raise SystemExit("feat choice options anchor missing")
          text = text.replace(old_options, new_options, 1)
          text = text.replace('<header><div><h3>{group.title}</h3><p>{group.description}</p></div><strong>{selected.length} / {group.count}</strong></header>', '<header><div><h3>{group.title}</h3><p>{group.description}</p></div><strong>{selected.length} / {requiredCount}</strong></header>', 1)
          old_buttons = '''                            {options.map(option => <button key={option.id} className={selected.includes(option.id) ? "selected" : ""} onClick={() => toggleFeatChoice(activeAdvancement.key, group.key, option.id, group.count)}>
                                      <span>{selected.includes(option.id) ? "✓" : "+"}</span><strong>{option.name}</strong>{option.detail && <small>{option.detail}</small>}
                                    </button>)}'''
          new_buttons = '''                            {requiredCount === 0 && <p className="feat-choice-failsafe">Нет доступных новых вариантов — этот обязательный выбор пропущен автоматически.</p>}
                                    {options.map(option => {
                                      const isSelected = selected.includes(option.id);
                                      const unavailable = !isSelected && !allowedOptionIds.has(option.id);
                                      const unavailableReason = group.key === "expertise" ? "Уже есть компетентность или нет владения" : "Владение уже получено";
                                      return <button key={option.id} disabled={unavailable} className={`${isSelected ? "selected " : ""}${unavailable ? "unavailable" : ""}`.trim()} onClick={() => toggleFeatChoice(activeAdvancement.key, group.key, option.id, requiredCount)}>
                                        <span>{isSelected ? "✓" : unavailable ? "×" : "+"}</span><strong>{option.name}</strong>{unavailable && <small>{unavailableReason}</small>}{!unavailable && option.detail && <small>{option.detail}</small>}
                                      </button>;
                                    })}'''
          if old_buttons not in text:
              raise SystemExit("feat buttons anchor missing")
          text = text.replace(old_buttons, new_buttons, 1)

          text, completion_count = re.subn(
              r'advancementChoiceComplete\(([A-Za-z][A-Za-z0-9_]*)\s*,\s*spells\s*,\s*character\.level\)',
              r'advancementChoiceComplete(\1, spells, character.level, character)',
              text,
          )
          if completion_count < 5:
              raise SystemExit(f"Expected at least 5 completion call updates, got {completion_count}")

          changelog_anchor = '''const siteChangelog = [{
            version: "1.1.0",'''
          changelog_new = '''const siteChangelog = [{
            version: "1.1.1",
            publishedAt: "2026-09-06T17:30:00Z",
            changes: [
              "Выбор владений теперь использует единый пул уже освоенных навыков и инструментов: повторно взять то же владение через «Одарённый», «Эксперт в навыке» или другой источник нельзя.",
              "Компетентность нельзя назначить повторно одному навыку; недоступные варианты помечаются прямо в интерфейсе, а невозможный обязательный выбор автоматически пропускается.",
              "PDF-экспорт закреплён на строгом формате A4 и получил устойчивую компоновку для длинных названий классов и мультиклассов.",
            ],
          }, {
            version: "1.1.0",'''
          if changelog_anchor not in text:
              raise SystemExit("changelog anchor missing")
          text = text.replace(changelog_anchor, changelog_new, 1)
          page.write_text(text, encoding="utf-8")

          css = root / "app/globals.css"
          css_text = css.read_text(encoding="utf-8")
          css_marker = '''@media print {
            .pdf-document { display: block !important; margin: 0; }
            .pdf-page { box-shadow: none; }
            .pdf-inventory-toggle, .pdf-prepared-summary button { display: none !important; }
            .mobile-character-sheet { display: none !important; }
          }'''
          css_replacement = '''@media print {
            html, body { width: 210mm !important; min-width: 210mm !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
            .pdf-document { display: block !important; position: absolute !important; inset: 0 auto auto 0 !important; width: 210mm !important; margin: 0 !important; padding: 0 !important; gap: 0 !important; }
            .pdf-page { width: 210mm !important; height: 297mm !important; min-height: 297mm !important; max-height: 297mm !important; margin: 0 !important; padding: 11mm 12mm 10mm !important; overflow: hidden !important; box-shadow: none; break-after: page !important; page-break-after: always !important; break-inside: avoid !important; page-break-inside: avoid !important; }
            .pdf-page:last-child { break-after: auto !important; page-break-after: auto !important; }
            .pdf-hero-header { margin: 4mm 0 3mm; }
            .pdf-hero-header h1 { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 20pt; }
            .pdf-hero-header dl div { min-height: 12mm; max-height: 12mm; overflow: hidden; }
            .pdf-hero-header dd { margin-top: .7mm; font-size: 7.2pt; line-height: 1.08; overflow-wrap: anywhere; }
            .pdf-ability-row { margin-bottom: 3mm; }
            .pdf-ability-row > div { min-height: 21mm; }
            .pdf-primary-grid { grid-template-rows: 122mm 74mm; height: 199mm; }
            .pdf-inventory-toggle, .pdf-prepared-summary button { display: none !important; }
            .mobile-character-sheet { display: none !important; }
          }

          .feat-choice-options button.unavailable { opacity: .5; cursor: not-allowed; border-style: dashed; filter: saturate(.5); }
          .feat-choice-options button.unavailable:hover { transform: none; }
          .feat-choice-options button.unavailable small { color: var(--copper-light); }
          .feat-choice-failsafe { grid-column: 1 / -1; margin: 0 0 8px; padding: 10px 12px; border: 1px dashed var(--teal); color: var(--teal); background: rgba(118,170,165,.06); font-size: 11px; }'''
          if css_marker not in css_text:
              raise SystemExit("print CSS anchor missing")
          css.write_text(css_text.replace(css_marker, css_replacement, 1), encoding="utf-8")

          for target_name in ("hosting", "hosting-test"):
              target = Path(target_name) / "app"
              for filename in ("featChoices.ts", "page.tsx", "globals.css"):
                  shutil.copy2(root / "app" / filename, target / filename)

          # Guard against accidental mismatch between the two published copies.
          for filename in ("featChoices.ts", "page.tsx", "globals.css"):
              canonical = (root / "app" / filename).read_bytes()
              for target_name in ("hosting", "hosting-test"):
                  if (Path(target_name) / "app" / filename).read_bytes() != canonical:
                      raise SystemExit(f"Sync failed for {target_name}/app/{filename}")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            export-1.1.0-python-sqlite/package-lock.json
            hosting-test/package-lock.json

      - name: Build hosting version
        working-directory: export-1.1.0-python-sqlite
        run: |
          npm ci
          npm run build

      - name: Sync built hosting dist
        shell: bash
        run: |
          if [ -d export-1.1.0-python-sqlite/dist ]; then
            rm -rf hosting/dist
            cp -a export-1.1.0-python-sqlite/dist hosting/dist
          fi

      - name: Build GitHub test version
        working-directory: hosting-test
        env:
          NEXT_PUBLIC_BASE_PATH: /list-geroya-5e
        run: |
          npm ci
          npm run build

      - name: Commit hotfix
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/hotfix-skill-pdf.trigger
          git add export-1.1.0-python-sqlite/app/featChoices.ts export-1.1.0-python-sqlite/app/page.tsx export-1.1.0-python-sqlite/app/globals.css
          git add hosting/app/featChoices.ts hosting/app/page.tsx hosting/app/globals.css hosting/dist
          git add hosting-test/app/featChoices.ts hosting-test/app/page.tsx hosting-test/app/globals.css
          git commit -m "fix: dedupe proficiencies and stabilize PDF export"
          git push origin HEAD:feature/multiclass-1.1
