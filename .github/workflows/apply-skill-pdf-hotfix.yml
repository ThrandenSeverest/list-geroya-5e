name: Apply skill dedupe and PDF hotfix

on:
  push:
    branches: [feature/multiclass-1.1]
    paths: [".github/hotfix-skill-pdf.trigger"]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multiclass-1.1
          fetch-depth: 0

      - name: Patch source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path('export-1.1.0-python-sqlite/app')
          feat = root / 'featChoices.ts'
          page = root / 'page.tsx'
          css = root / 'globals.css'

          t = feat.read_text(encoding='utf-8')
          t = t.replace('import { generatedFeats } from "./generatedRulesCorpus";\n', 'import { generatedFeats } from "./generatedRulesCorpus";\nimport { characterExpertiseSkills, characterProficiencies } from "./proficiencies";\n', 1)
          pattern = re.compile(r'export function advancementChoiceComplete\(choiceValue: AdvancementChoice, spells: CatalogSpell\[\], characterLevel = choiceValue\.level\) \{.*?\n\}', re.S)
          replacement = '''export function featChoiceAvailability(choiceValue: AdvancementChoice, group: FeatChoiceGroup, character?: ExportCharacter) {
  const proficiencyGroup = group.key === "skill" || group.key === "proficiencies" || group.key === "expertise";
  if (!character || !proficiencyGroup) return { options: group.options, count: group.count };

  const baseline: ExportCharacter = {
    ...character,
    advancements: (character.advancements || []).map(item => item.key === choiceValue.key
      ? { ...item, featChoices: { ...(item.featChoices || {}), [group.key]: [] } }
      : item),
  };
  const known = characterProficiencies(baseline);
  const ownedSkills = new Set(known.skills);
  const ownedTools = new Set(known.tools);
  const ownedExpertise = new Set(characterExpertiseSkills(baseline));
  let options = group.options;
  if (group.key === "skill") options = group.options.filter(option => !ownedSkills.has(option.id));
  if (group.key === "proficiencies") options = group.options.filter(option => !ownedSkills.has(option.id) && !ownedTools.has(option.id));
  if (group.key === "expertise") options = group.options.filter(option => ownedSkills.has(option.id) && !ownedExpertise.has(option.id));
  return { options, count: Math.min(group.count, options.length) };
}

export function advancementChoiceComplete(choiceValue: AdvancementChoice, spells: CatalogSpell[], characterLevel = choiceValue.level, character?: ExportCharacter) {
  if (!choiceValue.featId) return false;
  if (choiceValue.featId === "asi") return choiceValue.asiChoices.length === 2;
  return featChoiceGroups(choiceValue, spells, characterLevel).every(group => {
    const selected = choiceValue.featChoices?.[group.key] || [];
    const availability = featChoiceAvailability(choiceValue, group, character);
    const allowed = new Set(availability.options.map(option => option.id));
    return selected.length === availability.count && new Set(selected).size === selected.length && selected.every(id => allowed.has(id));
  });
}'''
          t, n = pattern.subn(replacement, t, count=1)
          if n != 1: raise SystemExit('advancementChoiceComplete patch failed')
          feat.write_text(t, encoding='utf-8')

          p = page.read_text(encoding='utf-8')
          p = p.replace('import { advancementChoiceComplete, featChoiceGroups, featGrantedSpellIds } from "./featChoices";', 'import { advancementChoiceComplete, featChoiceAvailability, featChoiceGroups, featGrantedSpellIds } from "./featChoices";', 1)
          p = p.replace('''      const selected = target.featChoices?.[groupKey] || [];
      const ownedSkills = new Set(characterProficiencies(current).skills);
      if (!selected.includes(id) && groupKey === "skill" && ownedSkills.has(id)) return current;
      if (!selected.includes(id) && groupKey === "expertise" && !ownedSkills.has(id)) return current;''', '''      const selected = target.featChoices?.[groupKey] || [];
      const known = characterProficiencies(current);
      const ownedSkills = new Set(known.skills);
      const ownedTools = new Set(known.tools);
      const ownedExpertise = new Set(characterExpertiseSkills(current));
      if (!selected.includes(id) && groupKey === "skill" && ownedSkills.has(id)) return current;
      if (!selected.includes(id) && groupKey === "proficiencies" && (ownedSkills.has(id) || ownedTools.has(id))) return current;
      if (!selected.includes(id) && groupKey === "expertise" && (!ownedSkills.has(id) || ownedExpertise.has(id))) return current;''', 1)

          old_block = re.compile(r'''\s*const selected = activeAdvancement\.featChoices\?\.\[group\.key\] \|\| \[\];\s*const ownedSkills = new Set\(proficiencies\.skills\);\s*const options = group\.key === "expertise"\s*\? group\.options\.filter\(option => ownedSkills\.has\(option\.id\) \|\| selected\.includes\(option\.id\)\)\s*: \(group\.key === "skill" \|\| group\.key === "proficiencies"\)\s*\? group\.options\.filter\(option => !ownedSkills\.has\(option\.id\) \|\| selected\.includes\(option\.id\)\)\s*: group\.options;''', re.S)
          new_block = '''\n                        const selected = activeAdvancement.featChoices?.[group.key] || [];
                        const availability = featChoiceAvailability(activeAdvancement, group, character);
                        const allowedOptionIds = new Set(availability.options.map(option => option.id));
                        const options = group.options;
                        const requiredCount = availability.count;'''
          p, n = old_block.subn(new_block, p, count=1)
          if n != 1: raise SystemExit('choice options patch failed')
          p = p.replace('{selected.length} / {group.count}', '{selected.length} / {requiredCount}', 1)

          button_pattern = re.compile(r'''\{options\.map\(option => <button key=\{option\.id\} className=\{selected\.includes\(option\.id\) \? "selected" : ""\} onClick=\{\(\) => toggleFeatChoice\(activeAdvancement\.key, group\.key, option\.id, group\.count\)\}>\s*<span>\{selected\.includes\(option\.id\) \? "✓" : "\+"\}</span><strong>\{option\.name\}</strong>\{option\.detail && <small>\{option\.detail\}</small>\}\s*</button>\)\}''', re.S)
          button_replacement = '''{requiredCount === 0 && <p className="feat-choice-failsafe">Нет доступных новых вариантов — этот обязательный выбор пропущен автоматически.</p>}
                            {options.map(option => {
                              const isSelected = selected.includes(option.id);
                              const unavailable = !isSelected && !allowedOptionIds.has(option.id);
                              const unavailableReason = group.key === "expertise" ? "Уже есть компетентность или нет владения" : "Владение уже получено";
                              return <button key={option.id} disabled={unavailable} className={`${isSelected ? "selected " : ""}${unavailable ? "unavailable" : ""}`.trim()} onClick={() => toggleFeatChoice(activeAdvancement.key, group.key, option.id, requiredCount)}>
                                <span>{isSelected ? "✓" : unavailable ? "×" : "+"}</span><strong>{option.name}</strong>{unavailable && <small>{unavailableReason}</small>}{!unavailable && option.detail && <small>{option.detail}</small>}
                              </button>;
                            })}'''
          p, n = button_pattern.subn(button_replacement, p, count=1)
          if n != 1: raise SystemExit('button patch failed')

          p, n = re.subn(r'advancementChoiceComplete\((\w+), spells, character\.level\)', r'advancementChoiceComplete(\1, spells, character.level, character)', p)
          if n < 5: raise SystemExit(f'completion calls patched only {n}')
          page.write_text(p, encoding='utf-8')

          c = css.read_text(encoding='utf-8')
          c += '''\n\n/* 1.1.1 proficiency/PDF hotfix */
          .feat-choice-options button.unavailable { opacity: .5; cursor: not-allowed; border-style: dashed; filter: saturate(.5); }
          .feat-choice-options button.unavailable:hover { transform: none; }
          .feat-choice-options button.unavailable small { color: var(--copper-light); }
          .feat-choice-failsafe { grid-column: 1 / -1; margin: 0 0 8px; padding: 10px 12px; border: 1px dashed var(--teal); color: var(--teal); background: rgba(118,170,165,.06); font-size: 11px; }
          @media print {
            html, body { width: 210mm !important; min-width: 210mm !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
            .pdf-document { display: block !important; position: absolute !important; inset: 0 auto auto 0 !important; width: 210mm !important; margin: 0 !important; padding: 0 !important; gap: 0 !important; }
            .pdf-page { width: 210mm !important; height: 297mm !important; min-height: 297mm !important; max-height: 297mm !important; margin: 0 !important; padding: 11mm 12mm 10mm !important; overflow: hidden !important; box-shadow: none !important; break-after: page !important; page-break-after: always !important; break-inside: avoid !important; page-break-inside: avoid !important; }
            .pdf-page:last-child { break-after: auto !important; page-break-after: auto !important; }
            .pdf-hero-header { margin: 4mm 0 3mm !important; }
            .pdf-hero-header h1 { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 20pt !important; }
            .pdf-hero-header dl div { min-height: 12mm !important; max-height: 12mm !important; overflow: hidden; }
            .pdf-hero-header dd { margin-top: .7mm !important; font-size: 7.2pt !important; line-height: 1.08 !important; overflow-wrap: anywhere; }
            .pdf-ability-row { margin-bottom: 3mm !important; }
            .pdf-ability-row > div { min-height: 21mm !important; }
            .pdf-primary-grid { grid-template-rows: 122mm 74mm !important; height: 199mm !important; }
          }
          '''
          css.write_text(c, encoding='utf-8')

          for target in (Path('hosting/app'), Path('hosting-test/app')):
            for name in ('featChoices.ts','page.tsx','globals.css'):
              shutil.copy2(root / name, target / name)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            export-1.1.0-python-sqlite/package-lock.json
            hosting-test/package-lock.json

      - name: Build hosting
        working-directory: export-1.1.0-python-sqlite
        run: npm ci && npm run build

      - name: Sync hosting build
        run: |
          rm -rf hosting/dist
          cp -a export-1.1.0-python-sqlite/dist hosting/dist

      - name: Build test copy
        working-directory: hosting-test
        env:
          NEXT_PUBLIC_BASE_PATH: /list-geroya-5e
        run: npm ci && npm run build

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/hotfix-skill-pdf.trigger
          git add export-1.1.0-python-sqlite/app/featChoices.ts export-1.1.0-python-sqlite/app/page.tsx export-1.1.0-python-sqlite/app/globals.css
          git add hosting/app/featChoices.ts hosting/app/page.tsx hosting/app/globals.css hosting/dist
          git add hosting-test/app/featChoices.ts hosting-test/app/page.tsx hosting-test/app/globals.css
          git commit -m "fix: dedupe proficiencies and stabilize PDF export"
          git push origin HEAD:feature/multiclass-1.1
