name: Rebuild committed dist for fix branch

on:
  push:
    branches:
      - fix/auto-linked-feature-choices

permissions:
  contents: write

concurrency:
  group: rebuild-dist-fix-auto-linked-feature-choices
  cancel-in-progress: true

jobs:
  rebuild-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-linked-feature-choices
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Finalize production build
        run: |
          python3 scripts/sanitize-committed-dist.py
          python3 scripts/write-build-info.py
      - name: Commit rebuilt dist
        run: |
          if git diff --quiet -- dist; then
            echo "dist already matches source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "build: refresh committed dist [skip ci]"
          git push origin HEAD:fix/auto-linked-feature-choices
