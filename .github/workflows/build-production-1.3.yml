name: Build HeroList 1.3 production folder

on:
  workflow_dispatch:
  push:
    branches:
      - feature/1.3
    paths:
      - "hosting-update-1.3.0/app/**"
      - "hosting-update-1.3.0/package.json"
      - "hosting-update-1.3.0/package-lock.json"
      - ".github/workflows/build-production-1.3.yml"

permissions:
  contents: write

concurrency:
  group: "production-1.3-dist"
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/1.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hosting-update-1.3.0/package-lock.json
      - run: npm ci
        working-directory: hosting-update-1.3.0
      - run: npm run check:subclasses
        working-directory: hosting-update-1.3.0
      - run: rm -rf dist
        working-directory: hosting-update-1.3.0
      - run: npm run build
        working-directory: hosting-update-1.3.0
      - name: Verify 1.3 output
        run: |
          grep -R -q "Проверить персонажа" hosting-update-1.3.0/dist/client/assets
          grep -R -q "Моё хоумбрю" hosting-update-1.3.0/dist/client/assets
          grep -R -q "Время накладывания" hosting-update-1.3.0/dist/client/assets
      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hosting-update-1.3.0/dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: refresh production dist for HeroList 1.3"
          git push origin HEAD:feature/1.3
