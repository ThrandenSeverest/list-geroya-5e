name: Build host-ready dist
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'backend/**'
      - 'deployment/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'next.config.ts'
      - '.github/workflows/host-dist.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: herolist-host-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check artwork
        run: bash scripts/prepare-classic-sheet-assets.sh
      - name: Build production server
        run: npm run build
      - name: Prepare host archive
        run: |
          HEROLIST_SOURCE_COMMIT="${GITHUB_SHA}" python3 scripts/write-build-info.py
          python3 scripts/sanitize-committed-dist.py
          test -f dist/server/index.js
          test -f dist/client/audio/dice-wood.mp3
          test -f dist/BUILD_INFO.json
          git add dist
          git diff --cached --check
      - name: Commit precompiled dist to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m "Build host-ready dist for ${GITHUB_SHA}"
          git push origin HEAD:main
