name: Build host-ready dist
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'backend/**'
      - 'deployment/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'next.config.ts'
      - '.github/workflows/host-dist.yml'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: herolist-host-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check artwork
        run: bash scripts/prepare-classic-sheet-assets.sh
      - name: Build production server
        run: npm run build
      - name: Prepare host archive
        run: |
          HEROLIST_SOURCE_COMMIT="${GITHUB_SHA}" python3 scripts/write-build-info.py
          python3 scripts/sanitize-committed-dist.py
          test -f dist/server/index.js
          test -f dist/client/audio/dice-wood.mp3
          test -f dist/BUILD_INFO.json
          git add dist
          git diff --cached --check
      - name: Commit precompiled dist to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Source updates may land while the compiler is running.
          # Rebuild on the newest main rather than force-pushing stale dist.
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              git reset --hard origin/main
              npm ci
              bash scripts/prepare-classic-sheet-assets.sh
              npm run build
              python3 scripts/sanitize-committed-dist.py
              python3 scripts/write-build-info.py
              python3 scripts/check-sanitized-dist.py
            fi
            git add -A dist
            if git diff --cached --quiet; then
              echo "Production dist already matches current main"
              exit 0
            fi
            git commit -m "build: sync verified production dist with source"
            if git push origin HEAD:main; then
              echo "Committed dist on current main"
              exit 0
            fi
            git reset --hard HEAD^
          done
          echo "main moved repeatedly during build; aborting instead of overwriting newer source"
          exit 1
