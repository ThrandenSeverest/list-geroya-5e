<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Лист Героя — Загрузка</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#061a35;overflow:hidden;user-select:none}
.art{width:100%;height:100%;background:url('splash-desktop.png') center/100% 100% no-repeat}
.loading{position:absolute;bottom:3.7%;left:0;right:0;display:flex;gap:10px;align-items:center;justify-content:center;color:#a7bad1;letter-spacing:.22em;font:10px Arial,sans-serif;text-transform:uppercase}
.dots{display:flex;gap:5px}.dots i{width:4px;height:4px;border-radius:50%;background:#f2bc60;opacity:.2;animation:pulse 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,60%,100%{opacity:.25;transform:scale(1)}30%{opacity:1;transform:scale(1.5)}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none;opacity:1}}
</style></head><body><div class="art" role="img" aria-label="Лист Героя, золотой лист персонажа и перо"></div>
<div class="loading" aria-label="Загрузка офлайн-приложения">Загрузка <span class="dots"><i></i><i></i><i></i></span></div>
</body></html>
