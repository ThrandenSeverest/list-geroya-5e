plugins { id 'com.android.application' }
android {
    namespace 'fun.superaistory.herolist'
    compileSdk 35
    defaultConfig {
        applicationId 'fun.superaistory.herolist'
        minSdk 26
        targetSdk 34
        versionCode 174
        versionName '1.7.4'
        manifestPlaceholders = [appLabel: 'Лист Героя 5e']
    }
    // Release APKs must use the same private signing key across all builds.
    // The key is restored from GitHub Actions secrets, never committed to Git.
    signingConfigs {
        release {
            def keyStorePath = System.getenv('HEROLIST_ANDROID_KEYSTORE_FILE')
            if (keyStorePath) {
                storeFile file(keyStorePath)
                storePassword System.getenv('HEROLIST_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HEROLIST_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('HEROLIST_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        // Unsigned release builds are not installable. Without a persistent
        // signing secret, publish a clearly separated preview application.
        // A fresh runner debug key must never overwrite the release package.
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            manifestPlaceholders = [appLabel: 'Лист Героя 5e (тест)']
            // Some OEM installers are stricter about supported signature formats.
            // The package remains correctly signed and verifiable with apksigner.
            v1SigningEnabled true
            v2SigningEnabled true
            v3SigningEnabled true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
