plugins { id 'com.android.application' }
android {
    namespace 'fun.superaistory.herolist'
    compileSdk 35
    defaultConfig {
        applicationId 'fun.superaistory.herolist'
        minSdk 26
        targetSdk 28
        versionCode 173
        versionName '1.7.3'
    }
    // Release APKs must use the same private signing key across all builds.
    // The key is restored from GitHub Actions secrets, never committed to Git.
    signingConfigs {
        release {
            def keyStorePath = System.getenv('HEROLIST_ANDROID_KEYSTORE_FILE')
            if (keyStorePath) {
                storeFile file(keyStorePath)
                storePassword System.getenv('HEROLIST_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HEROLIST_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('HEROLIST_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
