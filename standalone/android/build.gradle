plugins {
    id 'com.android.application' version '8.7.3' apply false
}

// Keep the public app version separate from release signing configuration.
subprojects { child ->
    child.pluginManager.withPlugin('com.android.application') {
        child.extensions.getByName('androidComponents').finalizeDsl { androidDsl ->
            androidDsl.defaultConfig.versionCode = 175
            androidDsl.defaultConfig.versionName = '1.7.5'
        }
    }
}
